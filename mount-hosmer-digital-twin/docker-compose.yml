# Mount Hosmer Avalanche Digital Twin (Stage 3) -- server (Linux/Docker) delivery mode.
#
# Stage 3 has no database and no job queue, so this file is small: a one-shot
# `bake` builds runtime/baked/, then a slim backend
# serves it (no geospatial stack), and the frontend serves the one screen.
#
#   docker compose up --build            # first run: builds, bakes, serves
#   open http://localhost:3000
#
# ===========================================================================
# THE FIRST-BOOT PROBLEM, AND HOW IT IS SOLVED
# ===========================================================================
# A fresh container has an empty runtime volume, so /api/health reports `baked: false`.
# The `bake` service below is a ONE-SHOT that runs `python -m app.bake` (reading the
# ~6.5 GB LiDAR allow-list from the read-only DATA mount) and exits. The backend waits
# for it via `service_completed_successfully`, so by the time the API serves traffic the
# baked artifacts genuinely exist.
#
# Note the image split: `bake` uses the heavy `bake` target (rasterio/pyproj); `backend`
# uses the slim `runtime` target with NO geospatial stack. They share the runtime volume:
# bake writes runtime/baked/, backend reads it. That is what keeps the serving image thin.
#
# Re-running without `--force` is cheap because an existing `runtime/baked/meta.json`
# is reused. Source or configuration changes are not detected automatically; force
# a rebuild after changing anything upstream of the bake.

name: mount-hosmer-digital-twin

services:
  # ===========================================================================
  # bake -- one-shot. Builds runtime/baked/ from DATA\, then exits 0.
  # ===========================================================================
  bake:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: bake
    image: mount-hosmer-bake:latest
    environment:
      AVALANCHE_DATA_ROOT: /data/mount_hosmer_data
      AVALANCHE_RUNTIME_ROOT: /runtime
    volumes:
      # -----------------------------------------------------------------------
      # INVARIANT I1 -- the `:ro` here is NOT optional and must never be removed.
      # -----------------------------------------------------------------------
      # Source data is expensive to re-download and partly irreplaceable (the Fernie
      # 2C21P archive 404s upstream). Read-only is the mechanical guarantee the bake
      # cannot destroy it. Only the bake mounts DATA\ at all.
      - ${AVALANCHE_DATA_HOST_PATH:-../DATA/mount_hosmer_data}:/data/mount_hosmer_data:ro
      - avalanche-runtime:/runtime
    restart: "no"

  # ===========================================================================
  # backend -- FastAPI, slim (rasterio-free). Serves the baked artifacts.
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    image: mount-hosmer-backend:latest
    environment:
      AVALANCHE_RUNTIME_ROOT: /runtime
      APP_ENV: ${APP_ENV:-production}
      AVALANCHE_CORS_ORIGINS: ${AVALANCHE_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Optional local AI. Point at an Ollama reachable from the container; unset =
      # assistant returns 503 and the rest of the app is unaffected.
      AVALANCHE_OLLAMA_URL: ${AVALANCHE_OLLAMA_URL:-}
      AVALANCHE_OLLAMA_MODEL: ${AVALANCHE_OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      # Read-only: the serving image never writes the baked artifacts, and never needs
      # DATA\ at all.
      - avalanche-runtime:/runtime:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      bake:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ===========================================================================
  # frontend -- static Next.js export served by nginx (no Node runtime).
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at BUILD time. It must be the URL the BROWSER can
        # reach -- `http://backend:8000` resolves only on this compose network, not in
        # the user's browser. Change it and rebuild: `docker compose build frontend`.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_ASSISTANT_BASE_URL: ${NEXT_PUBLIC_ASSISTANT_BASE_URL:-http://localhost:8000}
    image: mount-hosmer-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  avalanche-runtime:
