# Bake-time terrain parameters. Runtime assessment parameters live beside the
# rules that use them in app/risk.py and app/assess.py, so this file contains no
# inactive legacy weather, consequence, or confidence configuration.
version: "stage3-1.1.0"

terrain:
  # Mature canopy is treated as slab-anchoring forest. This is a regional,
  # uncalibrated assumption, not a Mount Hosmer measurement.
  forest_canopy_height_m: 3.0
