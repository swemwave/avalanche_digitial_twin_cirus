AWSTemplateFormatVersion: "2010-09-09"

# NOTE: CloudFormation caps `Description` at 1024 characters, so the explanation
# lives here in comments (which are not part of the template body) and the
# Description field below is kept short.
#
# Mount Hosmer avalanche digital twin -- four microservices on ECS Fargate behind
# one Application Load Balancer. Three (assess, assistant, frontend) are public,
# routed through the ALB; the fourth (bakeworker) is internal-only, reachable from
# assess alone over Service Connect, and normally parked at 0 tasks -- see
# BakeWorkerDesiredCount below.
#
# Topology
# --------
#     internet -> ALB (public) -> 3 Fargate tasks (public subnets)
#                                     assistant -> Cloudflare Tunnel -> a laptop
#                                                                       running Ollama
#                                     assess -> Service Connect -> bakeworker
#                                               (no ALB, no public route; parked at
#                                               0 tasks unless a demo needs live
#                                               mountain uploads)
#
# Two deliberate cost decisions, both worth understanding before changing them:
#
# 1. PUBLIC SUBNETS, NO NAT GATEWAY. Fargate tasks need outbound internet to pull
#    images from ECR and (for the assistant) to reach the Ollama tunnel. The usual
#    pattern is private subnets + a NAT gateway, which costs ~$32/month on its own --
#    more than every task here combined. Instead the tasks sit in public subnets with
#    public IPs, and are protected by a security group that accepts inbound traffic
#    ONLY from the load balancer. Nothing reaches a task directly from the internet.
#
# 2. FARGATE (on-demand) by default. Changed from FARGATE_SPOT because this stack
#    backs a physical QR code on a capstone poster and must stay live 24/7 --
#    SPOT's occasional interruption (ECS restarts the task automatically, usually
#    within a minute or two) is not acceptable for that. Set
#    CapacityProvider=FARGATE_SPOT for cheaper, interruption-tolerant local dev.
#
# CUSTOM DOMAIN + HTTPS. The public, QR-code-facing URL is https://<Domain>
# (default avalanche.gotlost.xyz), a Namecheap CNAME pointed at the ALB's
# hostname -- see the `dns` step in deploy.sh. Port 80 (HTTP) is left exactly as
# it was and is NOT redirected, because the assistant service also calls back
# into assess over plain HTTP through this same ALB; only port 443 (HTTPS) is new.
#
# Teardown is the whole stack:  bash deploy/aws/deploy.sh destroy
# Do NOT run this against the live poster deployment without repointing the
# Namecheap CNAME afterwards -- see docs/deployment.md section 5.

Description: >
  Mount Hosmer avalanche digital twin: assess, assistant and frontend microservices
  on ECS Fargate behind one path-routing Application Load Balancer. The AI model
  runs on the operator's own machine, reached through a tunnel. EXPERIMENTAL and
  NON-OPERATIONAL research prototype -- not an avalanche forecast.

# ===========================================================================
Parameters:
# ===========================================================================
  AssessImage:
    Type: String
    Description: ECR image URI for the assess service (terrain, tiles, hazard model).

  AssistantImage:
    Type: String
    Description: ECR image URI for the assistant service (the AI).

  FrontendImage:
    Type: String
    Description: ECR image URI for the Next.js frontend.

  OllamaUrl:
    Type: String
    Default: ""
    Description: >
      Public HTTPS URL of the Cloudflare Tunnel forwarding to Ollama on your machine.
      Empty is valid: the assistant then returns a clean 503 and the rest of the app
      is unaffected. Update it later without a redeploy of anything else.

  CapacityProvider:
    Type: String
    Default: FARGATE
    AllowedValues: [FARGATE_SPOT, FARGATE]
    Description: >
      FARGATE is on-demand and always-on -- the default, for the live poster
      deployment. FARGATE_SPOT is ~70% cheaper but interruptible; fine for local
      dev, not for something a QR code points at unattended.

  Domain:
    Type: String
    Default: avalanche.gotlost.xyz
    Description: >
      Public hostname for the stable, QR-code-facing URL. CloudFormation does not
      manage DNS -- a Namecheap CNAME must point this at the ALB's hostname
      (AlbDnsName output below; also printed by `deploy.sh dns`).

  CertificateArn:
    Type: String
    Description: >
      ARN of an ACM certificate covering Domain, already ISSUED. Request one and
      get the DNS validation record via `deploy.sh cert`. No default on purpose --
      a missing certificate fails this deploy loudly instead of silently shipping
      without HTTPS.

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 2
    Description: >
      Tasks per service. Set to 0 to park the stack: compute billing stops and only
      the ALB (~$16/month) keeps running. This is the single biggest cost lever.

  ExpectedBakeSha256:
    Type: String
    AllowedPattern: "^[0-9a-f]{64}$"
    Description: Exact baked-data identity required by the hourly public health probe.

  BakeWorkerImage:
    Type: String
    Description: >
      ECR image URI for the bakeworker service (rasterio/pyproj/PIL/yaml -- the only
      service in the fleet that carries them). Internal-only: never registered with
      the ALB, reachable from assess alone, over Service Connect.

  BakeWorkerDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 2
    Description: >
      Tasks for the bakeworker service, kept separate from DesiredCount above
      because live mountain uploads are a rarely-used demo feature, not core
      traffic. Default 0 means it is parked -- zero compute cost -- until this is
      explicitly raised (e.g. to demo live uploads).

# ===========================================================================
Resources:
# ===========================================================================

  # --- Network -------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true   # required for ECR/CloudWatch endpoint resolution
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-igw" }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # An ALB requires subnets in at least two Availability Zones.
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-a" }]

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-b" }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-rt" }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }

  SubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }

  # --- Security groups -----------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP/HTTPS entry point.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from anywhere.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from anywhere.
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-alb-sg" }]

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # This is what makes public subnets safe: the tasks have public IPs so they can
      # reach ECR and the Ollama tunnel outbound, but nothing on the internet can open
      # a connection TO them -- only the ALB's security group can.
      GroupDescription: Fargate tasks. Inbound from the load balancer only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: Backend services, from the ALB only.
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: Frontend, from the ALB only.
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-task-sg" }]

  # A rule that names its own security group as the source cannot be embedded in
  # SecurityGroupIngress above -- CloudFormation rejects that as a circular
  # dependency (the group would have to reference its own not-yet-created GroupId).
  # A separate AWS::EC2::SecurityGroupIngress resource is the documented way around
  # that: it can !Ref TaskSecurityGroup as both the group the rule attaches to and
  # the allowed source, because by the time THIS resource is created, the group
  # already exists.
  TaskSecurityGroupIngressBakeWorker:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: assess to bakeworker over Service Connect (both are members of this SG).

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        EFS mount targets for the shared /runtime/mountains volume. Inbound NFS from
        Fargate tasks (assess, bakeworker) only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref TaskSecurityGroup
          Description: NFS from assess/bakeworker tasks only.
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-efs-sg" }]

  # --- Load balancer -------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        # The ALB's default idle timeout is 60s. A `fast` assessment takes ~19s, but
        # `advanced` (particle ensemble) is far slower and would be cut off at 60s
        # as a 504 -- while the task keeps computing, so the logs show success and
        # the browser shows failure. 300s matches the assistant's Ollama timeout.
        - { Key: idle_timeout.timeout_seconds, Value: "300" }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-alb" }]

  # Target group health checks hit each task directly on its own port -- they do not
  # go through the listener rules below, so both backends can use /api/health.
  AssessTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8080
      Protocol: HTTP
      TargetType: ip                      # required for Fargate/awsvpc
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        # An assessment can take a while; do not cut a slow request off at the ALB.
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  AssistantTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher: { HttpCode: "200" }

  # Low-cost target-health alarms. They intentionally have no notification action:
  # alarm state remains visible in CloudWatch without creating an SNS subscription
  # or sending messages that the operator has not approved. The scheduled public
  # smoke test separately exercises bake identity, imagery, and a real assessment.
  AssessUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-assess-unhealthy"
      AlarmDescription: Assess target group has no fully healthy rollout.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt AssessTargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AssistantUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-assistant-unhealthy"
      AlarmDescription: Assistant container is unhealthy; deterministic services remain independent.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt AssistantTargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FrontendUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-frontend-unhealthy"
      AlarmDescription: Frontend target group has no fully healthy rollout.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt FrontendTargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # One small hourly Lambda invocation is materially cheaper than a continuously
  # running browser canary. It checks the public HTTPS surface, exact bake identity,
  # distinct centre imagery/terrain bytes and a real deterministic assessment. The
  # repository Playwright smoke additionally verifies the rendered views differ.
  LiveSmokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LiveSmokeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LiveSmokeRole.Arn
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          BASE_URL: !Sub "https://${Domain}"
          EXPECTED_BAKE_SHA256: !Ref ExpectedBakeSha256
      Code:
        ZipFile: |
          import hashlib,json,math,os,urllib.request
          BASE=os.environ["BASE_URL"]
          EXPECTED=os.environ["EXPECTED_BAKE_SHA256"]
          def request(path,payload=None):
              data=None if payload is None else json.dumps(payload,separators=(",", ":")).encode()
              headers={"User-Agent":"mount-hosmer-live-smoke/1"}
              if data is not None: headers["Content-Type"]="application/json"
              req=urllib.request.Request(BASE+path,data=data,headers=headers,method="POST" if data else "GET")
              with urllib.request.urlopen(req,timeout=45) as response:
                  if response.status != 200: raise RuntimeError(f"{path} returned {response.status}")
                  return response.read()
          def object_at(path,payload=None):
              value=json.loads(request(path,payload))
              if not isinstance(value,dict): raise RuntimeError(f"{path} returned non-object JSON")
              return value
          def handler(event,context):
              root=request("/").decode("utf-8","replace")
              if "Mount Hosmer" not in root or "Experimental research scenario" not in root or "never replaces Avalanche Canada guidance" not in root: raise RuntimeError("frontend safety copy absent")
              health=object_at("/api/health")
              if health.get("status")!="ok" or health.get("baked") is not True or health.get("bake_sha256")!=EXPECTED: raise RuntimeError("health or bake identity mismatch")
              meta=object_at("/api/twin/meta")
              imagery=meta.get("imagery") or {}; tiles=meta.get("tiles") or {}; center=meta.get("center_wgs84") or []
              if meta.get("schema")!="stage3-baked-v2" or (meta.get("identity") or {}).get("bake_sha256")!=EXPECTED or imagery.get("visual_context_only") is not True or len(center)!=2: raise RuntimeError("bake metadata incomplete")
              zoom=min(int(tiles["max_zoom"]),int(imagery["max_zoom"])); scale=2**zoom
              lat=max(-85.05112878,min(85.05112878,float(center[1]))); x=int((float(center[0])+180)/360*scale); y=int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*scale)
              def tile(template): return request(template.replace("{z}",str(zoom)).replace("{x}",str(x)).replace("{y}",str(y)))
              terrain=tile(tiles["url_template"]); satellite=tile(imagery["url_template"])
              if not terrain.startswith(b"\x89PNG\r\n\x1a\n") or not satellite.startswith(b"\x89PNG\r\n\x1a\n") or hashlib.sha256(terrain).digest()==hashlib.sha256(satellite).digest(): raise RuntimeError("imagery unavailable or identical")
              result=object_at("/api/assess",{"new_snow_cm":40,"wind_speed_kmh":45,"wind_direction_deg":225,"release_size":"medium","simulation_mode":"fast"})
              if result.get("is_operational_forecast") is not False or result.get("is_probability") is not False or (result.get("model") or {}).get("bake_sha256")!=EXPECTED or (result.get("conditions") or {}).get("provenance")!="user_supplied" or "NOT an operational avalanche forecast" not in result.get("disclaimer",""): raise RuntimeError("assessment safety or identity contract failed")
              return {"bake_sha256":EXPECTED,"frontend":True,"imagery":True,"assessment":True}

  LiveSmokeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LiveSmokeFunction}"
      RetentionInDays: 7

  LiveSmokeSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Hourly public application and bake-identity health probe.
      ScheduleExpression: cron(37 * * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt LiveSmokeFunction.Arn
          Id: live-smoke

  LiveSmokeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LiveSmokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LiveSmokeSchedule.Arn

  LiveSmokeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-live-smoke-errors"
      AlarmDescription: Hourly public frontend, bake, imagery, or assessment probe failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref LiveSmokeFunction }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  # Rule order matters and is set by Priority (lowest first). /api/assistant/* MUST
  # be evaluated before /api/*, or every assistant call would be routed to assess.
  AssistantRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: ["/api/assistant/*"] }
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AssistantTargetGroup

  AssessRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 20
      Conditions:
        - Field: path-pattern
          # Covers /api/assess, /api/twin/meta, and the tile pyramid.
          PathPatternConfig: { Values: ["/api/*"] }
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AssessTargetGroup

  # Additive, not a replacement for Listener above: the assistant task calls assess
  # back through this same ALB over plain HTTP (see AVALANCHE_ASSESS_URL below), so
  # port 80 keeps working unchanged. This is the QR-code-facing, HTTPS listener.
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  # Mirrors AssistantRule/AssessRule exactly -- same priorities, same path
  # patterns -- so routing behavior is identical on both listeners.
  AssistantRuleHttps:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: ["/api/assistant/*"] }
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AssistantTargetGroup

  AssessRuleHttps:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: ["/api/*"] }
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AssessTargetGroup

  # --- Shared storage (EFS) --------------------------------------------------
  # runtime/mountains/ (registry.json + per-upload source/pack.json/baked/bake.log,
  # see backend/app/mountains.py) is shared between assess and bakeworker, mounted
  # at the SAME container path in both task definitions below. Mount Hosmer's own
  # reviewed bake stays exactly where it is today -- baked into the assess image at
  # /runtime/baked -- and is deliberately NOT put on EFS. This also incidentally
  # fixes a latent bug: if AssessService's DesiredCount is ever raised above 1, each
  # task today has its own disconnected registry/uploads; EFS gives every task (of
  # either service) the same view.
  #
  # Bursting throughput (the default) and General Purpose performance mode: this is
  # a low-traffic demo feature (MAX_UPLOADED_MOUNTAINS = 3 in mountains.py, each
  # capped well under a GB), nowhere near where Provisioned/Elastic throughput would
  # pay for itself. No lifecycle-to-Infrequent-Access policy either, by choice: IA
  # trades a lower per-GB storage price for a per-GB retrieval fee and extra
  # first-touch latency, which is the wrong trade for data this small (cents/month
  # on Standard regardless) that gets touched in bursts exactly when someone is
  # live-demoing the upload feature -- the worst time to eat a retrieval penalty.
  MountainsFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      Encrypted: true
      FileSystemTags: [{ Key: Name, Value: !Sub "${AWS::StackName}-mountains" }]

  MountainsMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref MountainsFileSystem
      SubnetId: !Ref SubnetA
      SecurityGroups: [!Ref EfsSecurityGroup]

  MountainsMountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref MountainsFileSystem
      SubnetId: !Ref SubnetB
      SecurityGroups: [!Ref EfsSecurityGroup]

  # Scoped to /mountains so a mistaken RootDirectory elsewhere on the file system can
  # never be reached from a container -- EFSVolumeConfiguration.RootDirectory in the
  # task definitions below is required to be "/" (or omitted) whenever an access
  # point is used, so this Path is the only root a mounting container can ever get.
  # uid/gid 10001 matches Dockerfile.backend's `useradd --uid 10001 avalanche`, the
  # user both the assess and bakeworker containers run as -- CreationInfo makes the
  # directory owned by, and writable by, exactly that user on first mount, with no
  # IAM involved (see AuthorizationConfig.IAM: DISABLED on both task definitions,
  # and the ExecutionRole comment below explaining why that is deliberate here).
  MountainsAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref MountainsFileSystem
      PosixUser: { Uid: "10001", Gid: "10001" }
      RootDirectory:
        Path: /mountains
        CreationInfo: { OwnerUid: "10001", OwnerGid: "10001", Permissions: "0755" }

  # --- ECS -----------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      ClusterSettings:
        - { Name: containerInsights, Value: disabled }   # avoids CloudWatch charges
      # Default AWS Cloud Map namespace for Service Connect (assess -> bakeworker,
      # see BakeWorkerService below). A namespace name that does not already exist
      # is created automatically by ECS the first time a Service Connect-enabled
      # service deploys into it -- no separate AWS::ServiceDiscovery::* resource is
      # needed in this template. Verified against the AWS::ECS::Cluster
      # ServiceConnectDefaults CloudFormation reference: "If you enter a new name, a
      # AWS Cloud Map namespace will be created."
      ServiceConnectDefaults:
        Namespace: !Sub "${AWS::StackName}.local"

  # Pulls images from ECR and writes logs. This is the only IAM role needed: the
  # application itself calls no AWS APIs, so the tasks get no task role at all.
  #
  # The EFS mount below (MountainsAccessPoint) deliberately preserves that: IAM-based
  # EFS authorization (AuthorizationConfig.IAM: ENABLED) would need a task role with
  # elasticfilesystem:Client* permissions, so both task definitions instead set
  # IAM: DISABLED and rely only on the access point's POSIX uid/gid enforcement plus
  # EfsSecurityGroup's NFS-from-tasks-only rule for access control. Service Connect
  # (also added below) needs nothing extra on either role either -- no change here.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  AssessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/assess"
      RetentionInDays: 7        # keep CloudWatch storage negligible

  AssistantLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/assistant"
      RetentionInDays: 7

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/frontend"
      RetentionInDays: 7

  BakeWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/bakeworker"
      RetentionInDays: 7

  # 1 vCPU / 4 GB. MEASURED, not guessed: one assessment on the 2400x2400 (5.8M
  # cell) grid peaks at ~1477 MB resident. At 2048 MB the container was killed
  # mid-request with `OutOfMemoryError` (exit 137) and ECS silently restarted it,
  # which is what an assessment "just failing" in the browser looks like.
  #
  # 4 GB gives ~2.5x headroom, which matters because CPython does not return freed
  # arrays to the OS -- a container that has served one assessment stays near its
  # peak, so the SECOND request starts high rather than from cold.
  #
  # 1 vCPU (up from 0.5) roughly halves the ~19 s assessment as a side effect.
  # Together these cost about +$0.03/hour.
  AssessTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-assess"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64          # matches the linux/amd64 images we build
      # Shared with BakeWorkerTaskDefinition at the SAME container path and access
      # point, so both services (and every replica of either) see one registry and
      # one set of uploads, never a disconnected per-task copy.
      Volumes:
        - Name: mountains
          EFSVolumeConfiguration:
            FilesystemId: !Ref MountainsFileSystem
            TransitEncryption: ENABLED   # required whenever AuthorizationConfig uses an access point
            AuthorizationConfig:
              AccessPointId: !Ref MountainsAccessPoint
              IAM: DISABLED               # POSIX + security group only -- see ExecutionRole comment above
      ContainerDefinitions:
        - Name: assess
          Image: !Ref AssessImage
          Essential: true
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          MountPoints:
            - SourceVolume: mountains
              ContainerPath: /runtime/mountains
              ReadOnly: false
          Environment:
            - { Name: PORT, Value: "8080" }
            - { Name: AVALANCHE_RUNTIME_ROOT, Value: /runtime }
            # Reaches bakeworker over Service Connect -- see BakeWorkerService's
            # ServiceConnectConfiguration for the "bakeworker" DNS alias this
            # resolves to inside the cluster. When bakeworker is parked at 0 tasks
            # (the default), there is no healthy Service Connect endpoint to route
            # to, so a call here fails fast rather than hanging -- assess's own
            # httpx timeout on this URL is what keeps /api/mountains responsive.
            - { Name: AVALANCHE_BAKE_WORKER_URL, Value: "http://bakeworker:8080" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AssessLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  AssistantTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-assistant"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: assistant
          Image: !Ref AssistantImage
          Essential: true
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Environment:
            - { Name: PORT, Value: "8080" }
            # Reaches assess back through the same ALB. One extra hop, but zero
            # service-discovery configuration -- and the ALB is already paid for.
            - { Name: AVALANCHE_ASSESS_URL, Value: !Sub "http://${LoadBalancer.DNSName}" }
            - { Name: AVALANCHE_OLLAMA_URL, Value: !Ref OllamaUrl }
            - { Name: AVALANCHE_OLLAMA_MODEL, Value: "llama3.1:8b" }
            # An 8B model on a laptop, over a tunnel, is not fast.
            - { Name: AVALANCHE_OLLAMA_TIMEOUT_S, Value: "180" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AssistantLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-frontend"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          PortMappings: [{ ContainerPort: 3000, Protocol: tcp }]
          Environment:
            - { Name: PORT, Value: "3000" }
            - { Name: HOSTNAME, Value: "0.0.0.0" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # bakeworker runs the identical app.bake computation a real bake runs -- same
  # measured memory profile as AssessTaskDefinition above (see its comment block),
  # so it gets the same 1 vCPU / 4 GB rather than AssistantTaskDefinition's much
  # smaller 256/512, which is sized for a thin HTTP relay to Ollama, not a raster
  # computation.
  BakeWorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-bakeworker"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      Volumes:
        - Name: mountains
          EFSVolumeConfiguration:
            FilesystemId: !Ref MountainsFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref MountainsAccessPoint
              IAM: DISABLED
      ContainerDefinitions:
        - Name: bakeworker
          Image: !Ref BakeWorkerImage
          Essential: true
          # Name (not just ContainerPort) is what BakeWorkerService's
          # ServiceConnectConfiguration.Services[].PortName refers to below --
          # Service Connect resolves ports by this name, not by number.
          PortMappings:
            - { ContainerPort: 8080, Protocol: tcp, Name: bakeworker, AppProtocol: http }
          MountPoints:
            - SourceVolume: mountains
              ContainerPath: /runtime/mountains
              ReadOnly: false
          Environment:
            - { Name: PORT, Value: "8080" }
            - { Name: AVALANCHE_RUNTIME_ROOT, Value: /runtime }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BakeWorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  AssessService:
    Type: AWS::ECS::Service
    DependsOn: [AssessRule, DefaultRoute, MountainsMountTargetA, MountainsMountTargetB]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref AssessTaskDefinition
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public IP is what replaces the NAT gateway -- without it the task cannot
          # reach ECR and will fail to start with an image-pull timeout.
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - { ContainerName: assess, ContainerPort: 8080, TargetGroupArn: !Ref AssessTargetGroup }
      # "Client" Service Connect membership only -- assess calls bakeworker by its
      # advertised DNS name (see AVALANCHE_BAKE_WORKER_URL above) but exposes
      # nothing of its own via Service Connect, so there is no Services: list here.
      # Still reachable from the internet exactly as before, through
      # AssessTargetGroup; the two mechanisms are independent.
      ServiceConnectConfiguration:
        Enabled: true
      # The image is ~900 MB and the layers load on boot; do not let the ALB mark it
      # unhealthy while it is still coming up.
      HealthCheckGracePeriodSeconds: 120

  AssistantService:
    Type: AWS::ECS::Service
    DependsOn: [AssistantRule, DefaultRoute]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref AssistantTaskDefinition
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - { ContainerName: assistant, ContainerPort: 8080, TargetGroupArn: !Ref AssistantTargetGroup }
      HealthCheckGracePeriodSeconds: 60

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: [Listener, DefaultRoute]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref FrontendTaskDefinition
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - { ContainerName: frontend, ContainerPort: 3000, TargetGroupArn: !Ref FrontendTargetGroup }
      HealthCheckGracePeriodSeconds: 60

  # Cost control lives entirely in BakeWorkerDesiredCount (default 0). Unlike the
  # other three services, this one has NO LoadBalancers entry -- it is never
  # registered with any ALB target group and is reachable only from inside the VPC,
  # over Service Connect. It also does not use the shared DesiredCount parameter,
  # so baseline monthly cost is unchanged unless someone explicitly turns this on.
  BakeWorkerService:
    Type: AWS::ECS::Service
    DependsOn: [DefaultRoute, MountainsMountTargetA, MountainsMountTargetB]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BakeWorkerTaskDefinition
      DesiredCount: !Ref BakeWorkerDesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Same "no NAT gateway" reasoning as the other three services -- this task
          # also needs outbound to pull its image from ECR.
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      # Advertises itself as "bakeworker" in the cluster's default Service Connect
      # namespace (see Cluster.ServiceConnectDefaults above), so assess can reach it
      # at http://bakeworker:8080 -- exactly AVALANCHE_BAKE_WORKER_URL above --
      # without a second load balancer.
      ServiceConnectConfiguration:
        Enabled: true
        Services:
          - PortName: bakeworker
            DiscoveryName: bakeworker
            ClientAliases:
              - Port: 8080
                DnsName: bakeworker

# ===========================================================================
Outputs:
# ===========================================================================
  AppUrl:
    Description: Open this. All three services are behind it, so there is no CORS.
    Value: !Sub "http://${LoadBalancer.DNSName}"

  HealthUrl:
    Description: Assess health, including which bake the image carries.
    Value: !Sub "http://${LoadBalancer.DNSName}/api/health"

  AssistantHealthUrl:
    Description: >
      Assistant health -- shows whether the Ollama tunnel is configured. It lives
      under /api/assistant/ because /api/health routes to the assess service.
    Value: !Sub "http://${LoadBalancer.DNSName}/api/assistant/health"

  ClusterName:
    Value: !Ref Cluster

  AlbDnsName:
    Description: >
      Raw ALB hostname. Recreated (and changes) on every stack teardown/rebuild --
      point the Namecheap CNAME at this. `deploy.sh dns` prints it for you.
    Value: !GetAtt LoadBalancer.DNSName

  PublicAppUrl:
    Description: >
      The stable, QR-code-facing URL. Only resolves once the Namecheap CNAME
      points Domain at AlbDnsName.
    Value: !Sub "https://${Domain}"
